worker_processes 1;
pid /tmp/wine-cellar-nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    sendfile on;
    server_tokens off;
    client_max_body_size 0;

    client_body_temp_path /tmp/wine-cellar-nginx/client_body;
    proxy_temp_path /tmp/wine-cellar-nginx/proxy;
    fastcgi_temp_path /tmp/wine-cellar-nginx/fastcgi;
    uwsgi_temp_path /tmp/wine-cellar-nginx/uwsgi;
    scgi_temp_path /tmp/wine-cellar-nginx/scgi;

    server {
        listen 8080;
        server_name _;

        location /static/ {
            alias /home/app/web/staticfiles/;
        }

        location /media/ {
            alias /data/media/;
        }

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }
}
