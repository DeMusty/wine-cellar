services:
  wine-cellar:
    build:
      context: .
      dockerfile: Dockerfile.single
    image: wine-cellar-single:local
    container_name: wine-cellar
    restart: unless-stopped
    stop_grace_period: 4m
    ports:
      - "127.0.0.1:8086:8080"
    env_file:
      - .env.single
    depends_on:
      init-data:
        condition: service_completed_successfully
    volumes:
      - ./data/single-container:/data
